name: Native providers

on:
  workflow_call:
    inputs:
      release_validation:
        type: boolean
        default: true
  pull_request:
    paths:
      - "codex-rs/**"
      - "scripts/native_provider_*.py"
      - "scripts/tests/test_nyacode_branding.py"
      - "scripts/build_nyacode.py"
      - "scripts/install/**"
      - "codex-cli/**"
      - "scripts/tests/test_native_provider_*.py"
      - "docs/native-providers/**"
      - ".github/workflows/native-providers.yml"
  push:
    branches: [main]
    paths:
      - "codex-rs/**"
      - "scripts/native_provider_*.py"
      - "scripts/tests/test_nyacode_branding.py"
      - "scripts/build_nyacode.py"
      - "scripts/install/**"
      - "codex-cli/**"
      - "scripts/tests/test_native_provider_*.py"
      - "docs/native-providers/**"
      - ".github/workflows/native-providers.yml"
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: Upstream ref to probe
        required: false
        default: main
        type: string
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read

jobs:
  deterministic-linux:
    name: Linux architecture, tests, and features
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUST_MIN_STACK: "33554432"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-12
        with:
          toolchain: 1.95.0
          components: clippy, rustfmt
      - name: Install hosted Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libclang-dev libssl-dev pkg-config protobuf-compiler ripgrep
      - name: Verify pinned V8 archive and bindings
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-unknown-linux-gnu
      - name: Run focused native-provider checks and CLI build
        run: >-
          python3 scripts/native_provider_checks.py
          --artifact-dir /tmp/native-provider-checks
      - name: Verify fork installers and package layout
        env:
          CODEX_REPO_ROOT: ${{ github.workspace }}
        run: |
          python3 -m unittest discover -s scripts/install -p "test_install_sh.py"
          python3 -m unittest discover -s scripts/codex_package -p "test_*.py"
      - name: Test native Chat transport and lifecycle without credentials
        working-directory: codex-rs
        run: cargo test --locked -p codex-http-client -p codex-chatgpt-chat --lib
      - name: Check dependency migrations and public schemas
        working-directory: codex-rs
        run: >-
          cargo test --locked --lib
          -p codex-protocol -p codex-config -p codex-hooks -p codex-app-server-protocol
          -p codex-keyring-store -p codex-agent-identity -p codex-cloud-config
          -p codex-websocket-auth -p codex-core-plugins -p codex-shell-command
          -p codex-utils-cargo-bin
      - name: Check terminal rendering and state snapshots
        working-directory: codex-rs
        run: cargo test --locked -p codex-tui --lib
      - name: Check Code Mode execution and bundled ICU data
        working-directory: codex-rs
        run: cargo test --locked -p codex-code-mode-runtime --all-targets
      - name: Verify checks did not rewrite tracked source or dependency pins
        run: git diff --exit-code
      - name: Upload stage logs and summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-provider-ci-${{ github.run_id }}
          path: /tmp/native-provider-checks/
          if-no-files-found: warn
          retention-days: 7

  upstream-merge-probe:
    name: Upstream merge drift probe
    if: >-
      inputs.release_validation != true &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && github.event.repository.default_branch == 'main'))
    runs-on: ubuntu-24.04
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-12
        with:
          toolchain: 1.95.0
          components: clippy, rustfmt
      - name: Install hosted Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libclang-dev libssl-dev pkg-config protobuf-compiler ripgrep
      - name: Probe upstream merge in a temporary worktree
        env:
          UPSTREAM_REF: ${{ inputs.upstream_ref || 'main' }}
        run: >-
          python3 scripts/native_provider_upstream_probe.py
          --upstream-url https://github.com/openai/codex.git
          --upstream-ref "$UPSTREAM_REF"
          --output-dir /tmp/native-provider-upstream-probe
      - name: Upload hashes, logs, and conflict lists
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-provider-upstream-probe-${{ github.run_id }}
          path: /tmp/native-provider-upstream-probe/
          if-no-files-found: error
          retention-days: 7
