packages:
  - codex-cli
  - sdk/typescript

minimumReleaseAge: 10080
minimumReleaseAgeExclude: []

blockExoticSubdeps: true
strictDepBuilds: true
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 10080
trustPolicyExclude: []
allowBuilds:
  # These packages ship prebuilt platform binaries; no lifecycle scripts are needed.
  esbuild: false
  "@parcel/watcher": false
  unrs-resolver: false
  # Build only the official MCP conformance CLI pinned by the TypeScript SDK.
  "@modelcontextprotocol/conformance@https://codeload.github.com/modelcontextprotocol/conformance/tar.gz/49103de6ed70804e940637bf3e9e29e4a3f54e64": true

# pnpm 12 reads project settings here instead of .npmrc.
shamefullyHoist: true
strictPeerDependencies: false
nodeLinker: hoisted
preferWorkspacePackages: true

# Keep the pinned conformance tool on the same MCP SDK as our tests.
# esbuild's newer minor closes GHSA-g7r4-m6w7-qqqr in ts-jest's build tooling.
# load-nyc-config uses yaml.load, which is supported by js-yaml 4 and removes
# the obsolete argparse/sprintf-js dependency (GHSA-hp3w-g68c-fv3c).
overrides:
  "@modelcontextprotocol/sdk": "1.32.1"
  esbuild: "0.28.2"
  # Reject quadratic zone-identifier parsing (GHSA-rxp7-6hxx-x8q5).
  ip-address: "10.7.4"
  "@istanbuljs/load-nyc-config>js-yaml": "^4.1.1"
