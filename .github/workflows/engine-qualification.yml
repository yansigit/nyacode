name: Engine qualification

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      base_sha:
        description: Exact candidate base commit (empty for a cutover rehearsal).
        type: string
        default: ""
      pull_request:
        description: Candidate pull request number (zero for a rehearsal).
        type: string
        default: "0"
      release_tag:
        description: Stable upstream release tag (empty for a rehearsal).
        type: string
        default: ""

permissions:
  contents: read

jobs:
  dependency_policy:
    name: Dependency policy
    uses: ./.github/workflows/cargo-deny.yml

  controls:
    name: Engine controls
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check assembly controls
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/engine.py check --mode controls
      - run: python3 -m unittest discover -s scripts/tests -p 'test_engine*.py'

  providers:
    name: Standalone providers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: 1.95.0
      - run: cargo test --manifest-path crates/providers/Cargo.toml --locked --all-features

  validate:
    name: Release tooling and version
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      commit: ${{ steps.metadata.outputs.commit }}
    env:
      CODEX_REPO_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15.0"
      - name: Verify release controls, packaging, and installers
        run: |
          python3 -m unittest discover -s scripts/tests -p test_nyacode_release.py
          python3 -m unittest discover -s scripts/tests -p test_engine_candidates.py
          python3 -m unittest discover -s .github/scripts -p test_releases.py
          python3 -m unittest discover -s scripts/codex_package -p 'test_*.py'
          python3 -m unittest discover -s scripts/install -p test_install_sh.py
      - name: Lint Nyacode workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/actionlint"
          gh release download v1.7.12 --repo rhysd/actionlint \
            --pattern actionlint_1.7.12_linux_amd64.tar.gz --dir "$RUNNER_TEMP/actionlint"
          cd "$RUNNER_TEMP/actionlint"
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint_1.7.12_linux_amd64.tar.gz' | sha256sum --check
          tar -xzf actionlint_1.7.12_linux_amd64.tar.gz actionlint
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/actionlint/actionlint" .github/workflows/nyacode-release.yml .github/workflows/native-providers.yml .github/workflows/engine-*.yml
      - name: Validate source version and release ancestry
        id: metadata
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          args=()
          if [[ -n "$RELEASE_TAG" ]]; then args+=(--tag "$RELEASE_TAG"); fi
          python3 scripts/nyacode_release.py metadata --github-output "$GITHUB_OUTPUT" "${args[@]}"

  checks:
    name: Native provider checks
    needs: validate
    uses: ./.github/workflows/native-providers.yml
    with:
      full_engine: true

  build:
    name: Package ${{ matrix.target }}
    needs: validate
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      CODEX_REPO_ROOT: ${{ github.workspace }}
      # Reduce disk/memory pressure on standard runners; keep release optimizations.
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO: "off"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15.0"
      - name: Preserve Windows source paths and symlinks
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git config --global core.longpaths true
          New-Item -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock' -Force | Out-Null
          New-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock' -Name AllowDevelopmentWithoutDevLicense -PropertyType DWord -Value 1 -Force | Out-Null
      - name: Prepare pinned engine source
        env:
          GH_TOKEN: ${{ github.token }}
        id: engine
        shell: bash
        run: |
          python3 scripts/engine.py --json prepare > "$RUNNER_TEMP/engine.json"
          python3 -c 'import json, os; root = json.load(open(os.environ["RUNNER_TEMP"] + "/engine.json"))["output"]; print("root=" + root, file=open(os.environ["GITHUB_OUTPUT"], "a")); print("NYACODE_ENGINE_ROOT=" + root, file=open(os.environ["GITHUB_ENV"], "a"))'
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev cmake libssl-dev pkg-config protobuf-compiler
      - name: Configure macOS libclang
        if: runner.os == 'macOS'
        shell: bash
        run: |
          echo "LIBCLANG_PATH=$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib" >> "$GITHUB_ENV"
      - name: Configure Windows native build tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $llvm = Join-Path $env:ProgramFiles 'LLVM/bin'
          if (-not (Test-Path (Join-Path $llvm 'libclang.dll'))) { throw 'libclang.dll missing from runner image' }
          "LIBCLANG_PATH=$llvm" >> $env:GITHUB_ENV
          $llvm >> $env:GITHUB_PATH
      - name: Install Windows x64 assembler for BoringSSL
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          choco install nasm --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'NASM installation failed' }
          (Join-Path $env:ProgramFiles 'NASM') >> $env:GITHUB_PATH
      - name: Build optimized binaries and runtime helpers
        uses: ./.github/actions/build-cargo-package-binaries
        with:
          target: ${{ matrix.target }}
          binaries: nyacode codex-code-mode-host ${{ runner.os == 'Windows' && 'codex-command-runner codex-windows-sandbox-setup' || '' }}
          build-mode: release
          working-directory: ${{ steps.engine.outputs.root }}/codex-rs
      - name: Test Windows terminal process handling
        if: runner.os == 'Windows'
        # MSYS bash makes native descendants inherit disabled Ctrl-C handling.
        # Use a native parent shell to exercise ordinary ConPTY signal behavior.
        shell: pwsh
        working-directory: ${{ steps.engine.outputs.root }}/codex-rs
        env:
          TARGET: ${{ matrix.target }}
        run: cargo test --locked --release --target "$env:TARGET" -p codex-utils-pty --lib
      - name: Assemble archive and smoke-test its extracted bytes
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          python3 scripts/nyacode_release.py assemble \
            --target "$TARGET" \
            --binaries "$CARGO_TARGET_DIR/$TARGET/release" \
            --dist "$GITHUB_WORKSPACE/dist"
          git diff --exit-code
          git -C "$NYACODE_ENGINE_ROOT" diff --exit-code
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nyacode-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Retain assembly provenance even when a package fails
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-inputs-${{ matrix.target }}
          path: .engine/workspace/.git/nyacode/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  sdk:
    name: SDKs against the packaged CLI
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nyacode-x86_64-unknown-linux-musl
          path: dist
      - name: Extract the CLI package used by SDK tests
        run: |
          mkdir -p "$RUNNER_TEMP/nyacode-sdk"
          tar -xzf dist/codex-package-x86_64-unknown-linux-musl.tar.gz -C "$RUNNER_TEMP/nyacode-sdk"
          echo "CODEX_EXEC_PATH=$RUNNER_TEMP/nyacode-sdk/bin/codex" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.11.1
          cache: pnpm
      - name: Build, type-check, lint, and test the TypeScript SDK
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir sdk/typescript exec tsc --noEmit
          pnpm --dir sdk/typescript lint
          pnpm --dir sdk/typescript test --runInBand
          pnpm audit
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
      - name: Test the Python SDK against the same CLI
        working-directory: sdk/python
        run: |
          uv sync --only-group dev --frozen
          uv run --only-group dev --frozen --no-sync ruff check .
          uv run --only-group dev --frozen --no-sync ruff format --check .
          uv run --only-group dev --frozen --no-sync pytest
      - name: Verify generated files and dependency pins remain unchanged
        run: git diff --exit-code

  verify:
    name: Verify complete release set
    needs: [validate, checks, build, sdk]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: nyacode-*
          path: dist
          merge-multiple: true
      - name: Prepare pinned engine provenance
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 scripts/engine.py --json prepare > "$RUNNER_TEMP/engine.json"
          python3 -c 'import json, os; root = json.load(open(os.environ["RUNNER_TEMP"] + "/engine.json"))["output"]; print("NYACODE_ENGINE_ROOT=" + root, file=open(os.environ["GITHUB_ENV"], "a"))'
      - name: Verify checksums, source revision, version, and all six packages
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          COMMIT: ${{ needs.validate.outputs.commit }}
        run: python3 scripts/nyacode_release.py seal --dist dist --version "$VERSION" --commit "$COMMIT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-nyacode-release
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  verdict:
    name: Engine acceptance
    if: always()
    needs:
      [
        dependency_policy,
        controls,
        providers,
        validate,
        checks,
        build,
        sdk,
        verify,
      ]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require every qualification result and record exact source identity
        env:
          RESULTS: ${{ toJSON(needs) }}
          BASE_SHA: ${{ inputs.base_sha || github.sha }}
          PULL_REQUEST: ${{ inputs.pull_request || '0' }}
          RELEASE_TAG: ${{ inputs.release_tag || '' }}
        run: |
          python3 - <<'PYCODE'
          import hashlib, json, os, pathlib
          results = {name: result["result"] for name, result in json.loads(os.environ["RESULTS"]).items()}
          if any(result != "success" for result in results.values()):
              raise SystemExit("Qualification incomplete: " + json.dumps(results))
          report = {"schema_version": 1, "head_sha": os.environ["GITHUB_SHA"], "base_sha": os.environ["BASE_SHA"], "pull_request": int(os.environ["PULL_REQUEST"]), "release_tag": os.environ["RELEASE_TAG"], "run_id": int(os.environ["GITHUB_RUN_ID"]), "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]), "engine_lock_sha256": hashlib.sha256(pathlib.Path("engine.lock").read_bytes()).hexdigest(), "results": results}
          pathlib.Path("qualification.json").write_text(json.dumps(report, indent=2) + "\n")
          PYCODE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-qualification
          path: qualification.json
          if-no-files-found: error
          retention-days: 90
