name: rust-ci-full
on:
  workflow_call:
  push:
    branches:
      # Main pushes enter through postmerge-ci. Keep this opt-in branch trigger
      # for developers who want the full suite before merging.
      - "**full-ci**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualification:
    name: Engine qualification
    uses: ./.github/workflows/engine-qualification.yml
