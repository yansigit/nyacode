name: Engine upgrades

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Stable rust-vX.Y.Z tag (empty selects latest); manual rehearsal bypasses the schedule gate.
        type: string
        default: ""
      qualification_run:
        description: Existing qualification run ID to observe without proposing or publishing a candidate.
        type: string
        default: ""
  workflow_run:
    workflows: [Engine qualification]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: engine-upgrades
  cancel-in-progress: false

jobs:
  discover:
    name: Propose stable engine pin without write credentials
    if: github.event_name != 'workflow_run' && inputs.qualification_run == ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      proposed: ${{ steps.proposal.outputs.proposed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Resolve stable release and retain proposal diagnostics
        id: proposal
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || '' }}
          SCHEDULED: ${{ github.event_name == 'schedule' }}
          NYACODE_ENGINE_UPGRADES_ENABLED: ${{ vars.NYACODE_ENGINE_UPGRADES_ENABLED }}
        run: |
          args=()
          if [[ "$SCHEDULED" == 'true' ]]; then args+=(--scheduled); fi
          python3 scripts/engine_candidates.py discover --tag "$RELEASE_TAG" --output "$RUNNER_TEMP/candidate/candidate.json" "${args[@]}"
          if [[ -f "$RUNNER_TEMP/candidate/candidate.json" ]]; then
            echo 'proposed=true' >> "$GITHUB_OUTPUT"
            python3 -c 'import json, os; proposal = json.load(open(os.environ["RUNNER_TEMP"] + "/candidate/candidate.json")); print("prepared=" + str(proposal["prepared"]).lower(), file=open(os.environ["GITHUB_OUTPUT"], "a"))'
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.proposal.outputs.proposed == 'true'
        with:
          name: engine-candidate-proposal
          path: ${{ runner.temp }}/candidate/candidate.json
          if-no-files-found: error
          retention-days: 7
      - name: Retain failed proposal evidence
        if: failure() || steps.proposal.outputs.prepared == 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-candidate-diagnostics
          path: .engine/upgrades/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  publish-candidate:
    name: Publish approved pin and explicitly dispatch qualification
    needs: discover
    if: needs.discover.outputs.proposed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      actions: write
    outputs:
      qualification_run: ${{ steps.publish.outputs.qualification_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: engine-candidate-proposal
          path: ${{ runner.temp }}/candidate
      - name: Validate untrusted proposal data with the trusted base controller
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/engine_candidates.py publish --proposal "$RUNNER_TEMP/candidate/candidate.json" --github-output "$GITHUB_OUTPUT"

  observe:
    name: Report completed candidate qualification
    needs: publish-candidate
    # Explicit continuation also covers GITHUB_TOKEN runs whose workflow_run event is suppressed.
    # The status function permits manual replay and fallback when publication was skipped.
    if: >-
      !cancelled() &&
      (github.event_name == 'workflow_run' || inputs.qualification_run != '' ||
       needs.publish-candidate.outputs.qualification_run != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      pull-requests: write
      actions: read
    outputs:
      consider_promotion: ${{ steps.report.outputs.consider_promotion }}
      qualification_run: ${{ steps.report.outputs.qualification_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Link results only to the candidate at the run's exact branch and head
        id: report
        env:
          GH_TOKEN: ${{ github.token }}
          QUALIFICATION_RUN: ${{ github.event.workflow_run.id || inputs.qualification_run || needs.publish-candidate.outputs.qualification_run }}
        # Leave ten minutes within the hosted job limit to fail closed and allow manual replay.
        run: python3 scripts/engine_candidates.py observe --run-id "$QUALIFICATION_RUN" --wait-seconds 21000 --github-output "$GITHUB_OUTPUT"

  promote:
    name: Promote only the exact fully qualified candidate
    needs: observe
    if: needs.observe.outputs.consider_promotion == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Verify run, jobs, base, head, report, and allowed lock changes
        env:
          GH_TOKEN: ${{ github.token }}
          QUALIFICATION_RUN: ${{ needs.observe.outputs.qualification_run }}
        run: python3 scripts/engine_candidates.py promote --run-id "$QUALIFICATION_RUN"
