name: Native providers

on:
  workflow_call:
    inputs:
      full_engine:
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-linux:
    name: Linux architecture, tests, and features
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUST_MIN_STACK: "33554432"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare pinned engine source
        env:
          GH_TOKEN: ${{ github.token }}
        id: engine
        shell: bash
        run: |
          python3 scripts/engine.py --json prepare > "$RUNNER_TEMP/engine.json"
          python3 -c 'import json, os; root = json.load(open(os.environ["RUNNER_TEMP"] + "/engine.json"))["output"]; print("root=" + root, file=open(os.environ["GITHUB_OUTPUT"], "a")); print("NYACODE_ENGINE_ROOT=" + root, file=open(os.environ["GITHUB_ENV"], "a"))'
      - name: Read assembled Rust toolchain
        id: rust
        env:
          ENGINE_ROOT: ${{ steps.engine.outputs.root }}
        run: python3 -c 'import os, pathlib, tomllib; print("toolchain=" + tomllib.loads((pathlib.Path(os.environ["ENGINE_ROOT"]) / "codex-rs/rust-toolchain.toml").read_text())["toolchain"]["channel"], file=open(os.environ["GITHUB_OUTPUT"], "a"))'
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-12
        with:
          toolchain: ${{ steps.rust.outputs.toolchain }}
          components: clippy, rustfmt
      - name: Install hosted Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libclang-dev libssl-dev pkg-config protobuf-compiler ripgrep
      - name: Verify pinned V8 archive and bindings
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-unknown-linux-gnu
      - name: Run focused native-provider checks and CLI build
        run: >-
          python3 scripts/native_provider_checks.py
          --repo "${{ steps.engine.outputs.root }}"
          --artifact-dir /tmp/native-provider-checks
      - name: Verify fork installers and package layout
        env:
          CODEX_REPO_ROOT: ${{ github.workspace }}
        run: |
          python3 -m unittest discover -s scripts/install -p "test_install_sh.py"
          python3 -m unittest discover -s scripts/codex_package -p "test_*.py"
      - name: Test native Chat transport and lifecycle without credentials
        working-directory: ${{ steps.engine.outputs.root }}/codex-rs
        run: cargo test --locked -p codex-http-client -p codex-chatgpt-chat --lib
      - name: Check dependency migrations and public schemas
        working-directory: ${{ steps.engine.outputs.root }}/codex-rs
        run: >-
          cargo test --locked --lib
          -p codex-protocol -p codex-config -p codex-hooks -p codex-app-server-protocol
          -p codex-keyring-store -p codex-agent-identity -p codex-cloud-config
          -p codex-websocket-auth -p codex-core-plugins -p codex-shell-command
          -p codex-utils-cargo-bin
      - name: Check terminal rendering and state snapshots
        working-directory: ${{ steps.engine.outputs.root }}/codex-rs
        run: cargo test --locked -p codex-tui --lib
      - name: Check Code Mode execution and bundled ICU data
        working-directory: ${{ steps.engine.outputs.root }}/codex-rs
        run: cargo test --locked -p codex-code-mode-runtime --all-targets
      - name: Check all core targets for an engine qualification
        if: inputs.full_engine == true
        working-directory: ${{ steps.engine.outputs.root }}/codex-rs
        run: cargo test --locked -p codex-core --all-targets
      - name: Verify frozen RPC and storage compatibility
        run: python3 scripts/engine_compatibility.py --workspace "${{ steps.engine.outputs.root }}"
      - name: Verify checks did not rewrite tracked source or dependency pins
        env:
          ENGINE_ROOT: ${{ steps.engine.outputs.root }}
        run: |
          git diff --exit-code
          git -C "$ENGINE_ROOT" diff --exit-code
      - name: Upload stage logs and summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-provider-ci-${{ github.run_id }}
          path: |
            /tmp/native-provider-checks/
            .engine/workspace/.git/nyacode/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
