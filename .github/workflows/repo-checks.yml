name: repo-checks

on:
  workflow_call:

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-ci

      - name: Prepare pinned engine for source policy checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/engine.py prepare
          echo "CODEX_REPO_ROOT=$GITHUB_WORKSPACE/.engine/workspace" >> "$GITHUB_ENV"

      - name: Verify codex-rs Cargo manifests inherit workspace settings
        run: python3 .github/scripts/verify_cargo_workspace_manifests.py

      - name: Test Cargo manifest policy exceptions
        run: python3 -m unittest discover -s .github/scripts -p 'test_verify_cargo_workspace_manifests.py'

      - name: Verify codex-tui does not import codex-core directly
        run: python3 .github/scripts/verify_tui_core_boundary.py

      - name: Verify Bazel clippy flags match Cargo workspace lints
        run: python3 .github/scripts/verify_bazel_clippy_lints.py

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"

      - name: Test required CI result aggregation
        run: python3 -m unittest discover -s .github/scripts -p 'test_check_ci_results.py'

      - name: Test owned-source formatting controls
        run: python3 -m unittest discover -s scripts/tests -p 'test_format.py'

      - name: Test downstream Python release resolution
        run: python3 -m unittest discover -s .github/scripts -p 'test_resolve_python_cli_release.py'

      - name: Test release version comparison
        run: python3 -m unittest discover -s .github/scripts -p 'test_releases.py'

      - name: Test V8 source fetch retries and change detection
        run: |
          python3 -m unittest discover -s .github/scripts -p 'test_run_v8_bazel_build.py'
          python3 -m unittest discover -s .github/scripts -p 'test_v8_canary_changes.py'

      - name: Test PyPI release verification
        run: uv run --no-project --with packaging==26.3 python -m unittest discover -s .github/scripts -p 'test_verify_pypi_release.py'

      - name: Test Codex package builder
        run: python3 -m unittest discover -s scripts/codex_package -p 'test_*.py'

      - name: Test standalone installer
        run: python3 -m unittest discover -s scripts/install -p 'test_*.py'

      - name: Test macOS signing and notarization
        run: python3 -m unittest discover -s .github/scripts/macos-signing -p 'test_*.py'

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.11.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure root README.md contains only ASCII and certain Unicode code points
        run: ./scripts/asciicheck.py README.md
      - name: Check root README ToC
        run: python3 scripts/readme_toc.py README.md

      - name: Install pinned Rust formatter
        run: rustup toolchain install "$(python3 -c 'import json; print(json.load(open("engine.lock"))["toolchain"])')" --profile minimal --component rustfmt

      - name: Check formatting (run `just fmt` to fix)
        run: just fmt-check

      - name: Prettier (run `pnpm run format:fix` to fix)
        run: pnpm run format

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree
