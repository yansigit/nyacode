name: Engine review

# An approval on an engine candidate wakes the sweep, which promotes the exact approved head.
# The job checks out nothing from the pull request and holds only the permission to dispatch.

on:
  pull_request_review:
    types: [submitted]

permissions: {}

jobs:
  sweep:
    name: Sweep engine candidates after an approval
    if: >-
      github.event.review.state == 'approved' &&
      startsWith(github.event.pull_request.head.ref, 'engine/rust-v') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Dispatch the default-branch sweep
        run: gh workflow run engine-upgrades.yml --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH"
