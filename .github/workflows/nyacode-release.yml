name: Nyacode packages

on:
  push:
    branches: [main]
    tags: ["rust-v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nyacode-packages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Release tooling and version
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      commit: ${{ steps.metadata.outputs.commit }}
    env:
      CODEX_REPO_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15.0"
      - name: Verify release controls, packaging, and installers
        run: |
          python3 -m unittest discover -s scripts/tests -p test_nyacode_release.py
          python3 -m unittest discover -s .github/scripts -p test_releases.py
          python3 -m unittest discover -s scripts/codex_package -p 'test_*.py'
          python3 -m unittest discover -s scripts/install -p test_install_sh.py
      - name: Lint Nyacode workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/actionlint"
          gh release download v1.7.12 --repo rhysd/actionlint \
            --pattern actionlint_1.7.12_linux_amd64.tar.gz --dir "$RUNNER_TEMP/actionlint"
          cd "$RUNNER_TEMP/actionlint"
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint_1.7.12_linux_amd64.tar.gz' | sha256sum --check
          tar -xzf actionlint_1.7.12_linux_amd64.tar.gz actionlint
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/actionlint/actionlint" .github/workflows/nyacode-release.yml .github/workflows/native-providers.yml .github/workflows/engine-*.yml
      - name: Validate source version and release ancestry
        id: metadata
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          args=()
          if [[ -n "$RELEASE_TAG" ]]; then args+=(--tag "$RELEASE_TAG"); fi
          python3 scripts/nyacode_release.py metadata --github-output "$GITHUB_OUTPUT" "${args[@]}"

  qualification:
    name: Full engine qualification
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    needs: validate
    uses: ./.github/workflows/engine-qualification.yml

  publish:
    name: Publish versioned GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/rust-v') && github.repository == 'yansigit/nyacode'
    needs: [validate, qualification]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: nyacode-release-publication
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: nyacode-*
          path: dist
          merge-multiple: true
      - name: Prepare pinned engine provenance
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 scripts/engine.py --json prepare > "$RUNNER_TEMP/engine.json"
          python3 -c 'import json, os; root = json.load(open(os.environ["RUNNER_TEMP"] + "/engine.json"))["output"]; print("NYACODE_ENGINE_ROOT=" + root, file=open(os.environ["GITHUB_ENV"], "a"))'
      - name: Publish only after every uploaded asset has the expected digest
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
          COMMIT: ${{ needs.validate.outputs.commit }}
        run: python3 .github/scripts/publish_nyacode_release.py --dist dist --version "$VERSION" --commit "$COMMIT"

  cleanup-intermediate-artifacts:
    name: Remove consumed package artifacts
    needs: [qualification, publish]
    if: >-
      always() && needs.qualification.result == 'success' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped') &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Remove copies after every consumer succeeds
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          PUBLISHED: ${{ needs.publish.result == 'success' }}
        run: |
          query='.artifacts[] | select(.name | startswith("nyacode-")) | .id'
          if [[ "$PUBLISHED" == "true" ]]; then
            query='.artifacts[] | select((.name | startswith("nyacode-")) or .name == "verified-nyacode-release") | .id'
          fi
          gh api --paginate "repos/$REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100" --jq "$query" > "$RUNNER_TEMP/consumed-artifact-ids"
          while IFS= read -r artifact_id; do
            gh api --method DELETE "repos/$REPOSITORY/actions/artifacts/$artifact_id"
          done < "$RUNNER_TEMP/consumed-artifact-ids"
