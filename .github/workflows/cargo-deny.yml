name: cargo-deny

on:
  workflow_call:

jobs:
  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-ci

      - name: Read pinned Rust toolchain
        id: rust
        run: python3 -c 'import os, sys; sys.path.insert(0, "scripts"); from pathlib import Path; from engine import load_lock; print("toolchain=" + load_lock(Path("."))["toolchain"], file=open(os.environ["GITHUB_OUTPUT"], "a"))'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-12
        with:
          toolchain: ${{ steps.rust.outputs.toolchain }}

      - name: Prepare pinned engine
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/engine.py prepare

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          rust-version: ${{ steps.rust.outputs.toolchain }}
          manifest-path: ./.engine/workspace/codex-rs/Cargo.toml

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree
